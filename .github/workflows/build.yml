name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

  # typecheck, lint, knip, every unit suite with coverage, build, bundle budget.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same pgvector container the dev stack and the suites expect (port 5500).
      - run: docker compose up -d postgres
      - run: until docker exec atlas-postgres pg_isready -U atlas; do sleep 1; done
      - run: pnpm gate

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d postgres
      - run: until docker exec atlas-postgres pg_isready -U atlas; do sleep 1; done
      - run: pnpm -r build
      # Headless shell for the suite, full Chromium for push-delivery (notifications).
      - run: pnpm exec playwright install --with-deps chromium chromium-headless-shell
      # team-config specs commit to a local bare repo.
      - run: git config --global user.email e2e@atlas.local && git config --global user.name "Atlas e2e"
      # CI unset: visual snapshots stay off until Linux baselines are committed
      # (e2e/visual/README.md), and no retries hide a flake.
      - run: pnpm e2e --forbid-only
        env:
          CI: ''
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-logs/*.log
          retention-days: 7
