name: Gate

# 2026-09-12 — before this, CI ran only `pnpm -r build` + the bundle budget.
# Typecheck, lint, unit tests and e2e never ran automatically, which is how
# three attribution bugs, a dashboard counter frozen at 20, two silently
# ignored API query filters and 14 red e2e specs all survived unnoticed.
#
# COST: `.agents/testing.md` records an explicit Owner decision — "tests do
# not run in CI, by design. There is no Actions plan to spend on them." This
# workflow is deliberately shaped around that constraint rather than through
# it:
#
#   * `fast` (typecheck · lint · shared/web/mcp tests) runs on every push and
#     PR. No service containers, no browser download — the cheap job that
#     catches the largest share of regressions.
#   * `api` (needs Postgres) and `e2e` (needs Postgres + Chromium) ran ONLY
#     nightly / on demand until 2026-09-21.
#
# 2026-09-21 — the Owner took the spend decision the other way: api and e2e
# now run per-PR. The trigger is why. `pnpm gate` was red for so long that
# nobody read it, and under that cover a hook timeout in cli-sessions.test.ts
# sat undetected because the only thing that ran the api suite was a human
# remembering to. Nightly catches it a day late, on main, after the merge.
#
# `concurrency: cancel-in-progress` below is what keeps this affordable:
# pushing three times to a PR costs one e2e run, not three.
#
# NOTE these are not *required* status checks — `main`'s protection has none
# configured, so a red run informs but does not block. Make them required
# only once they have shown they are not flaky; e2e is timing-sensitive and a
# required flaky check on a single-maintainer repo blocks every merge.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC nightly — offset off the hour to dodge the scheduler spike.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: typecheck · lint · shared+web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -F @atlas/shared test
      - run: pnpm -F @atlas/web test
      - run: pnpm -F @atlas/mcp test

  api:
    name: api tests (postgres)
    # Per-PR since 2026-09-21 (Owner spend decision). Was nightly + on demand.
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5500/atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docker-compose Postgres, not a `services:` container: migration 007
      # needs `shared_preload_libraries=pg_stat_statements`, which a service
      # container cannot set and docker-compose.yml already does.
      - run: pnpm db:up
      - run: pnpm db:wait
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5500/atlas
      # `test:coverage` since 2026-09-21. This used to run bare `test`
      # because the api thresholds (98/98/98/96) sat above the measured
      # numbers, so gating on them would have made the job red on day one.
      # ADR 0009's ratchet fixed that: the floors are now measured-minus-0.5pp
      # and pass, so this job can enforce them. Same minutes, one more gate.
      - run: pnpm -F @atlas/api test:coverage

  e2e:
    name: e2e (chromium + mobile + ipad)
    # Most expensive job: Postgres + a Chromium download + 3 viewport
    # projects (~9 min). Per-PR since 2026-09-21 (Owner spend decision).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # NOT a `services:` container. `e2e/global-setup.ts` recreates the
      # atlas_e2e DB via `docker exec atlas-postgres psql ...`, so the
      # container has to exist under that exact name — which is what
      # docker-compose (and therefore `pnpm db:up`) creates. A `services:`
      # postgres is reachable on the port but has no such container name, so
      # global-setup would fail before the first spec ran. Using db:up also
      # means CI brings the stack up exactly the way a developer does.
      - run: pnpm db:up
      - run: pnpm db:wait
        env:
          DATABASE_URL: postgres://atlas:atlas@localhost:5500/atlas
      - run: pnpm exec playwright install --with-deps chromium
      # The visual-snapshot specs are left out: they switch on under CI=true,
      # but no Linux baselines are committed (see e2e/visual/README.md), so
      # each one times out and retries. This is the behavioural suite across
      # all three viewport projects.
      - run: pnpm e2e --grep-invert "visual baseline"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
